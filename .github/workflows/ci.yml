name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install offline test dependency
        run: python -m pip install "pytest>=7.0"

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.py' '*.md' '*.yaml' '*.yml'; then
            echo "Unresolved merge markers found."
            exit 1
          fi

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run offline tests
        run: python -m pytest tests/ -v
